version: '3.8'

services:
  # --- BANCO DE DADOS ---
  db:
    image: postgres:15-alpine
    container_name: saei_postgres
    environment:
      POSTGRES_USER: saei_user
      POSTGRES_PASSWORD: saei_password
      POSTGRES_DB: saei_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saei_network

  # --- BACKEND (FASTAPI) ---
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: saei_backend
    ports:
      - "8000:8000" # Acesse a API em http://localhost:8000
    environment:
      DATABASE_URL: postgresql://saei_user:saei_password@db:5432/saei_db
      SECRET_KEY: dcvEek8zldAUpcB3OT9h3nczSpB3nq35v7WMXtUSgOB
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - saei_network

  # --- FRONTEND (REACT + VITE) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saei_frontend
    ports:
      - "5173:5173" # Acesse o React em http://localhost:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules # Impede que sua máquina local sobrescreva as dependências do container
    depends_on:
      - backend
    networks:
      - saei_network

volumes:
  postgres_data:

networks:
  saei_network:
    driver: bridge
